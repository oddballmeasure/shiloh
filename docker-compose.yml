services:
  mongodb:
    image: mongo:7
    container_name: korean-study-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: korean-study-backend
    restart: unless-stopped
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongodb:27017}
      MONGO_DB_NAME: ${MONGO_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-kor,eng}
      ASSIGNMENT_PDF_MAX_BYTES: ${ASSIGNMENT_PDF_MAX_BYTES:-52428800}
    depends_on:
      - mongodb
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: korean-study-frontend
    restart: unless-stopped
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_DISCORD_ID: ${AUTH_DISCORD_ID}
      AUTH_DISCORD_SECRET: ${AUTH_DISCORD_SECRET}
      BACKEND_URL: http://backend:8000
      BACKEND_INTERNAL_AUTH_SECRET: ${INTERNAL_AUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  mongodb-data:
