[project]
name = "shiloh"
version = "0.1.0"
description = "Korean language learning application with FastAPI and Next.js"
readme = "README.md"
authors = [
    { email = "monty@zenitsu" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "motor>=3.6.0",
    "ocrmypdf>=16.10.0",
    "openai>=1.99.0",
    "pydantic-settings>=2.4.0",
    "pymupdf4llm>=0.0.27",
    "pyjwt>=2.9.0",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
shiloh = "shiloh.main:run"
shiloh-admin = "shiloh.management:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.12.7",
]
